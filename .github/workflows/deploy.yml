name: Deploy to AWS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # =========================
      # 0. SETUP
      # =========================
      - name: Set lowercase image name
        run: |
          echo "API_IMAGE_NAME=$(echo '${{ github.repository }}/api' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # =========================
      # 1. CHECKOUT & BUILD
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: python.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

      # =========================
      # 2. TERRAFORM APPLY
      # =========================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform destroy
        run: terraform destroy -auto-approve
        working-directory: registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # =========================
      # 3. BRIDGE: TERRAFORM -> ANSIBLE
      # =========================
      - name: Extract Terraform Outputs
        id: tf
        run: |
          # Récupérer l'IP du serveur
          SERVER_IP=$(terraform output -raw instance_ip)
          echo "SERVER_IP=$SERVER_IP" >> $GITHUB_ENV
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT

          # Récupérer et écrire la clé SSH
          terraform output -raw ssh_private_key > key.pem
          chmod 600 key.pem

          # Générer l'inventaire dynamique
          echo "[web]" > inventory.ini
          echo "$SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini

          echo "📋 Inventaire généré:"
          cat inventory.ini
        working-directory: registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # =========================
      # 4. ANSIBLE DEPLOY
      # =========================
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Wait for EC2 to be ready
        run: |
          echo "⏳ Attente de 60s pour que l'EC2 soit prête..."
          sleep 60

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini playbook.yml \
            --extra-vars "ghcr_user=${{ github.actor }} ghcr_token=${{ secrets.GITHUB_TOKEN }} api_image=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest"
        working-directory: registry

      # =========================
      # 5. OUTPUT URL
      # =========================
      - name: Display Application URL
        run: |
          echo "=============================================="
          echo "🚀 DÉPLOIEMENT TERMINÉ !"
          echo "=============================================="
          echo ""
          echo "➡️  Dashboard: http://${{ env.SERVER_IP }}:8080"
          echo "➡️  API:       http://${{ env.SERVER_IP }}:8000"
          echo "➡️  Adminer:   http://${{ env.SERVER_IP }}:8081"
          echo ""
          echo "=============================================="
