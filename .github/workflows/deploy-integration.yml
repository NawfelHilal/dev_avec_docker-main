name: Deploy Integration

on:
  workflow_run:
    workflows: ["Publish to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up API Image tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/$REPO_LOWER/api:latest" >> $GITHUB_ENV

      - name: Start Stack
        run: docker compose up -d

      - name: Wait for services
        run: sleep 20

      - name: Verify Nginx Proxying
        run: |
          # Check if Nginx (port 8080) can reach the API
          curl -f http://localhost:8080/api/health || (echo "Nginx proxy failed" && exit 1)

      - name: Check Container Source
        run: |
          # Verify that the api container is using the GHCR image
          IMAGE_USED=$(docker inspect dashboard-api --format '{{.Config.Image}}')
          echo "Image used: $IMAGE_USED"
          if [[ $IMAGE_USED == *"ghcr.io"* ]]; then
            echo "Correct: Using GHCR image."
          else
            echo "Error: Not using GHCR image."
            exit 1
          fi
