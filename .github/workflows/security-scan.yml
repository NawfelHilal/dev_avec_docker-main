name: Security Scan

on:
  workflow_run:
    workflows: ["Build and Test Python"]
    types:
      - completed

jobs:
  security-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        image: ['nginx:alpine', 'postgres:alpine', 'redis:alpine']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Image ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: .trivyignore
