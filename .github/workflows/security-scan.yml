name: Security Scan

on:
  workflow_run:
    workflows: ["Build and Test Python"]
    types:
      - completed

jobs:
  security-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Infrastructure Images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx:1.27-alpine'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan Postgres
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'postgres:17-alpine'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan Redis
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'redis:7-alpine'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
