name: Build and Test Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dashboard-api:latest -f python.Dockerfile .

      - name: Run container
        run: |
          docker run -d --name test-api \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PASSWORD=pass \
            -e POSTGRES_USER=user \
            -e POSTGRES_DB=db \
            -e REDIS_HOST=localhost \
            -e SKIP_DB_CHECK=false \
            dashboard-api:latest

      - name: Wait for service
        run: sleep 10

      - name: Check logs for pattern
        run: |
          docker logs test-api
          docker logs test-api 2>&1 | grep -qi "running on" || (echo "Startup pattern not found" && exit 1)

      - name: Smoke Test (Curl)
        run: |
          echo "Starting smoke test on http://localhost:8000/health"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            echo "Attempt $i: Status $STATUS"
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 503 ] || [ "$STATUS" -eq 500 ]; then
              echo "Service is reachable (Status: $STATUS)"
              exit 0
            fi
            sleep 3
          done
          echo "Service failed to respond after several attempts."
          curl -v http://localhost:8000/health || true
          exit 1

      - name: Stop container
        if: always()
        run: docker stop test-api && docker rm test-api
