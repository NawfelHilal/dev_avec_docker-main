name: Build and Test Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dashboard-api:latest -f python.Dockerfile .

      - name: Run container
        run: |
          docker run -d --name test-api \
            -p 8000:8000 \
            -e POSTGRES_HOST=mock \
            -e POSTGRES_PASSWORD=pass \
            -e POSTGRES_USER=user \
            -e POSTGRES_DB=db \
            -e REDIS_HOST=mock \
            dashboard-api:latest

      - name: Wait for service
        run: sleep 5

      - name: Check logs for pattern
        run: |
          docker logs test-api
          docker logs test-api | grep -q "uvicorn" || (echo "Pattern not found" && exit 1)

      - name: Smoke Test (Curl)
        run: |
          # Note: The health check might fail if DB/Redis aren't actually up, 
          # but we just want to see if the HTTP server responds.
          # Using -s to be silent, -o to ignore body, -w to get status code.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 503 ] || [ "$STATUS" -eq 500 ]; then
            echo "Service responded with status $STATUS"
          else
            echo "Service failed to respond (Status: $STATUS)"
            exit 1
          fi

      - name: Stop container
        if: always()
        run: docker stop test-api && docker rm test-api
