name: Build and Test Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dashboard-api:latest -f python.Dockerfile .

      - name: Run container
        run: |
          docker run -d --name test-api \
            -p 8000:8000 \
            -e POSTGRES_HOST=mock \
            -e POSTGRES_PASSWORD=pass \
            -e POSTGRES_USER=user \
            -e POSTGRES_DB=db \
            -e REDIS_HOST=mock \
            -e SKIP_DB_CHECK=true \
            dashboard-api:latest

      - name: Wait for service
        run: sleep 5

      - name: Check logs for pattern
        run: |
          docker logs test-api
          docker logs test-api | grep -q "uvicorn" || (echo "Pattern not found" && exit 1)

